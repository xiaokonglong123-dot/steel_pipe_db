name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backend:
    name: Backend release binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: cargo build --release
        working-directory: backend
        run: cargo build --release

      - name: package
        run: |
          TAG="${GITHUB_REF_NAME}"
          strip "backend/target/release/erp-v2"
          tar czf "erp-v2-${TAG}-linux-x86_64.tar.gz" \
            -C backend/target/release erp-v2 \
            -C "$GITHUB_WORKSPACE/backend" .env.example

      - uses: actions/upload-artifact@v4
        with:
          name: backend-tarball
          path: erp-v2-*.tar.gz

  frontend:
    name: Frontend dist bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1

      - name: bun install
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: vite build
        working-directory: frontend
        run: bun run build

      - name: package
        run: |
          TAG="${GITHUB_REF_NAME}"
          cd frontend && zip -qr "../frontend-dist-${TAG}.zip" dist

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-zip
          path: frontend-dist-*.zip

  publish:
    name: Publish GitHub Release
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" assets/* \
            --title "$TAG" \
            --generate-notes
