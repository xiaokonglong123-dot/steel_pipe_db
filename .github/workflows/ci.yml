name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust（fmt / clippy / 分层 / 测试）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: 格式
        run: cargo fmt --all -- --check
      - name: Clippy（零告警）
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: 分层断言
        run: bash scripts/ci/layering.sh
      - name: 测试
        run: cargo test --workspace

  contract:
    name: 前端构建 / OpenAPI 契约漂移
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 前端依赖
        working-directory: web
        run: npm ci
      - name: 前端构建
        working-directory: web
        run: npm run build
      - name: 生成 OpenAPI
        run: cargo run --quiet --bin steelpipe -- openapi > openapi.json
      - name: 生成 TS 客户端类型
        working-directory: web
        run: npm run gen:api
      - name: 契约漂移检查
        run: |
          if ! git diff --exit-code -- web/src/api/schema.d.ts; then
            echo "::error::web/src/api/schema.d.ts 与后端 OpenAPI 不一致，请本地执行 npm run gen:api 后提交"
            exit 1
          fi
