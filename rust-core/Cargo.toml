[package]
name = "rust_core"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[lib]
name = "rust_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
rand_core = { version = "0.6", features = ["getrandom"] }
argon2 = "0.5"
jsonwebtoken = "9"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
