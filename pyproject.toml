[project]
name = "ayanami-rei"
version = "0.8.0"
description = "API 5CT seamless pipe & screen pipe inventory management (FastAPI + Rust PyO3 + SQLite)"
readme = "docs/2026-07-13-api5ct-inventory-design.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
imports = [
    "pandas>=2.2",
    "openpyxl>=3.1",
]
rust = [
    "maturin>=1.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27",
]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: tests that exercise heavy multi-thousand-row paths (kept opted-in-able via -m slow).",
    "requires_rust: tests that need the rust-core PyO3 module built and importable.",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Agent-workflow scratch trees tracked under .superpowers/ are frozen snapshots
# of pre-change files, not source; linting them reports errors nobody can fix.
extend-exclude = [".superpowers", ".cortexkit", "ayanami_rei.egg-info"]

[tool.ruff.lint]
# `ruff check` must stay at zero (see AGENTS.md COMMANDS). Deliberately not
# `ALL`: docstring/annotation-completeness rules (D/ANN) would demand a rewrite
# with no runtime benefit.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4", "SIM", "RET", "RUF", "ASYNC", "BLE"]
ignore = [
    # Comments and docstrings here are written in Chinese, which intentionally
    # uses fullwidth punctuation and en dashes.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Test files are deliberately self-sufficient: each one inserts the repo root on
# sys.path and sets DATABASE_URL / JWT_SECRET_KEY *before* importing `src`, so
# import-not-at-top-of-file is the required shape, not a defect.
"tests/*" = ["E402"]

[tool.ruff.lint.isort]
# `src` is imported as a first-party package by tests too (sys.path.insert),
# and `rust_core` is the maturin-built extension module.
known-first-party = ["src", "rust_core"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Form()/Query()/File() are evaluated per request, so using
# them as parameter defaults is the framework's intended style, not B008.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Path",
]
