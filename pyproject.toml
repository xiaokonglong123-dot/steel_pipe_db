[project]
name = "ayanami-rei"
version = "0.7.0"
description = "API 5CT seamless pipe & screen pipe inventory management (FastAPI + Rust PyO3 + SQLite)"
readme = "docs/2026-07-13-api5ct-inventory-design.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
imports = [
    "pandas>=2.2",
    "openpyxl>=3.1",
]
rust = [
    "maturin>=1.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27",
]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: tests that exercise heavy multi-thousand-row paths (kept opted-in-able via -m slow).",
    "requires_rust: tests that need the rust-core PyO3 module built and importable.",
]

[tool.ruff]
line-length = 100
target-version = "py311"
