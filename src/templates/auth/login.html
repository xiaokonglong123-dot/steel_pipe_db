{% extends "base.html" %}
{% block title %}登录 · Ayanami_Rei{% endblock %}

{% block styles %}
<style>
    body {
        padding-top: 80px;
        background:
            repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 30px),
            repeating-linear-gradient(90deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 30px),
            var(--bg-base);
    }
    .login-shell {
        max-width: 400px;
        margin: 64px auto 0;
        padding: 0 16px;
    }
    .login-card {
        background: var(--bg-elevated);
        border: 1px solid var(--border);
        border-top-color: rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35), 0 2px 4px rgba(0, 0, 0, 0.3);
        padding: 32px 28px 28px;
    }
    .login-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        justify-content: center;
        margin-bottom: 24px;
    }
    .login-brand .brand-avatar {
        width: 36px; height: 36px;
        border-radius: 10px;
        background: linear-gradient(135deg, #60a5fa 0%, #1d4ed8 100%);
        color: white;
        font-weight: 700;
        font-size: 18px;
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 4px 12px rgba(59, 130, 246, 0.35);
    }
    .login-brand .brand-name {
        font-size: 18px;
        font-weight: 600;
        color: var(--text-strong);
        letter-spacing: -0.02em;
    }
    .login-card h2 {
        text-align: center;
        font-size: 20px;
        font-weight: 600;
        color: var(--text-strong);
        letter-spacing: -0.02em;
        margin: 0 0 4px 0;
    }
    .login-card .login-sub {
        text-align: center;
        color: var(--text-faint);
        font-size: 13px;
        margin-bottom: 24px;
    }
    .login-card .login-btn {
        width: 100%;
        padding: 9px 16px;
        font-size: 14px;
        font-weight: 500;
        margin-top: 4px;
    }
    .login-card .form-control {
        padding: 9px 12px;
    }
    .login-card .alert-danger {
        border-color: rgba(248, 113, 113, 0.3);
        background: var(--danger-soft);
        color: #fca5a5;
    }
    .login-foot {
        margin-top: 20px;
        text-align: center;
        color: var(--text-faint);
        font-size: 12px;
    }
</style>
{% endblock %}

{% block navbar_user %}{% endblock %}

{% block content %}
<div class="login-shell">
    <div class="login-brand">
        <span class="brand-avatar">A</span>
        <span class="brand-name">Ayanami_Rei</span>
    </div>
    <div class="login-card">
        <h2>登录</h2>
        <div class="login-sub">API 5CT 油套管库存管理系统</div>
        {% if error %}
        <div class="alert alert-danger flash" role="alert">{{ error }}</div>
        {% endif %}
        <form method="POST" action="/login">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div class="mb-3">
                <label for="username" class="form-label">用户名</label>
                <input type="text" class="form-control" id="username" name="username" required autofocus autocomplete="username">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">密码</label>
                <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-accent login-btn">登录</button>
        </form>
        <div class="login-foot">
            Argon2 + JWT 通过 Rust 安全核心 · SQLite WAL
        </div>
    </div>
</div>
{% endblock %}
