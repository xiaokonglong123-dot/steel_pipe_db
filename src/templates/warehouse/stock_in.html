{% extends "base.html" %}
{% block title %}单管入库 · Ayanami_Rei{% endblock %}

{% block content %}
<header class="page-head">
    <div class="title-row">
        <h1><i class="bi bi-plus-circle" aria-hidden="true"></i>单管入库</h1>
        <span class="stat-inline">手动登记单根钢管 · 提交时自动 API 5CT 合规校验</span>
    </div>
</header>

{% if error %}
<div class="alert alert-danger flash" role="alert">
    <i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i><span>{{ error }}</span>
</div>
{% endif %}

<form method="POST" action="/tubes/stock-in" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

    <div class="panel">
        <div class="panel-head"><h2><i class="bi bi-upc-scan" aria-hidden="true"></i> 标识与类型</h2></div>
        <div class="panel-body">
            <div class="form-grid">
                <div class="field span-2">
                    <label class="form-label" for="pipe_id">管子编号</label>
                    <input class="form-control" id="pipe_id" name="pipe_id" type="text"
                           placeholder="留空则由系统按 {SP|SCP}-{钢级}-{外径}x{壁厚}-{uuid8} 生成">
                    <span class="form-hint">手填需符合 <code>SP-</code> / <code>SCP-</code> 前缀 + 4 段格式，否则 422。</span>
                </div>
                <div class="field">
                    <label class="form-label" for="type">管子类型</label>
                    <select class="form-select" id="type" name="type" onchange="toggleSpecFields()">
                        {% for val, label in pipe_types %}
                        <option value="{{ val }}">{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="field">
                    <label class="form-label" for="quality_mark">质量标记</label>
                    <select class="form-select" id="quality_mark" name="quality_mark">
                        {% for val, label in quality_marks %}
                        <option value="{{ val }}">{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
        </div>
    </div>

    <div class="panel">
        <div class="panel-head"><h2><i class="bi bi-rulers" aria-hidden="true"></i> 几何与材质</h2></div>
        <div class="panel-body">
            <div class="form-grid">
                <div class="field">
                    <label class="form-label" for="outer_diameter_mm">外径 (mm) <span class="req">*</span></label>
                    <input type="number" step="0.1" class="form-control" id="outer_diameter_mm" name="outer_diameter_mm" required>
                </div>
                <div class="field">
                    <label class="form-label" for="wall_thickness_mm">壁厚 (mm) <span class="req">*</span></label>
                    <input type="number" step="0.01" class="form-control" id="wall_thickness_mm" name="wall_thickness_mm" required>
                </div>
                <div class="field">
                    <label class="form-label" for="length_m">长度 (m) <span class="req">*</span></label>
                    <input type="number" step="0.01" class="form-control" id="length_m" name="length_m" required>
                </div>
                <div class="field">
                    <label class="form-label" for="steel_grade">钢级 <span class="req">*</span></label>
                    <input type="text" class="form-control" id="steel_grade" name="steel_grade" required placeholder="J55 / L80 / P110">
                </div>
                <div class="field">
                    <label class="form-label" for="location">库位 <span class="req">*</span></label>
                    <select class="form-select" id="location" name="location" required>
                        <option value="">选择库位</option>
                        {% for loc in locations %}
                        <option value="{{ loc.code }}">{{ loc.code }} — {{ loc.name or '' }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="field">
                    <label class="form-label" for="manufacturer">生产厂家 <span class="req">*</span></label>
                    <input type="text" class="form-control" id="manufacturer" name="manufacturer" required>
                </div>
            </div>
        </div>
    </div>

    <div class="panel">
        <div class="panel-head"><h2><i class="bi bi-patch-check" aria-hidden="true"></i> 追溯信息</h2></div>
        <div class="panel-body">
            <div class="form-grid">
                <div class="field">
                    <label class="form-label" for="thread_type">螺纹类型</label>
                    <input type="text" class="form-control" id="thread_type" name="thread_type">
                </div>
                <div class="field">
                    <label class="form-label" for="api_5ct_cert">API 5CT 证书</label>
                    <input type="text" class="form-control" id="api_5ct_cert" name="api_5ct_cert">
                </div>
                <div class="field">
                    <label class="form-label" for="batch_no">批号</label>
                    <input type="text" class="form-control" id="batch_no" name="batch_no">
                </div>
                <div class="field">
                    <label class="form-label" for="heat_no">炉号</label>
                    <input type="text" class="form-control" id="heat_no" name="heat_no">
                </div>
                <div class="field">
                    <label class="form-label" for="heat_treat_method">热处理方式</label>
                    <input type="text" class="form-control" id="heat_treat_method" name="heat_treat_method">
                </div>
                <div class="field">
                    <label class="form-label" for="quality_note">质量备注</label>
                    <input type="text" class="form-control" id="quality_note" name="quality_note">
                </div>
            </div>
        </div>
    </div>

    <div id="seamless_spec_fields" class="panel">
        <div class="panel-head"><h2><i class="bi bi-circle" aria-hidden="true"></i> 无缝管规格</h2></div>
        <div class="panel-body">
            <div class="form-grid">
                <div class="field">
                    <label class="form-label" for="surface_treatment">表面处理</label>
                    <input type="text" class="form-control" id="surface_treatment" name="surface_treatment" placeholder="磷化 / 镀锌 / 涂漆">
                </div>
                <div class="field">
                    <label class="form-label" for="end_protector">端部保护器</label>
                    <input type="text" class="form-control" id="end_protector" name="end_protector" placeholder="塑料保护环 / 钢制保护环">
                </div>
            </div>
        </div>
    </div>

    <div id="screen_spec_fields" class="panel" hidden>
        <div class="panel-head"><h2><i class="bi bi-grid-3x3" aria-hidden="true"></i> 筛管规格</h2></div>
        <div class="panel-body">
            <div class="form-grid">
                <div class="field">
                    <label class="form-label" for="screen_type">筛网类型</label>
                    <input type="text" class="form-control" id="screen_type" name="screen_type" placeholder="绕丝 / 割缝 / 精密">
                </div>
                <div class="field">
                    <label class="form-label" for="slot_pattern">槽型</label>
                    <input type="text" class="form-control" id="slot_pattern" name="slot_pattern" placeholder="矩形 / 梯形">
                </div>
                <div class="field">
                    <label class="form-label" for="slot_width_mm">槽宽 (mm)</label>
                    <input type="number" step="0.01" class="form-control" id="slot_width_mm" name="slot_width_mm" value="0">
                </div>
                <div class="field">
                    <label class="form-label" for="slot_density">槽密度 (孔/m)</label>
                    <input type="number" step="0.1" class="form-control" id="slot_density" name="slot_density" value="0">
                </div>
                <div class="field">
                    <label class="form-label" for="filtration_rating_um">过滤精度 (μm)</label>
                    <input type="number" step="0.1" class="form-control" id="filtration_rating_um" name="filtration_rating_um" value="0">
                </div>
                <div class="field">
                    <label class="form-label" for="base_pipe_grade">母管钢级</label>
                    <input type="text" class="form-control" id="base_pipe_grade" name="base_pipe_grade">
                </div>
            </div>
        </div>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-accent"><i class="bi bi-check-lg" aria-hidden="true"></i> 确认入库</button>
        <a href="/tubes" class="btn btn-ghost">取消</a>
        <span class="spacer"></span>
        <span class="form-hint"><i class="bi bi-shield-check" aria-hidden="true"></i> 入库即写入审计链</span>
    </div>
</form>

<script>
function toggleSpecFields() {
    var isScreen = document.getElementById('type').value === 'screen_pipe';
    document.getElementById('seamless_spec_fields').hidden = isScreen;
    document.getElementById('screen_spec_fields').hidden = !isScreen;
}
</script>
{% endblock %}
