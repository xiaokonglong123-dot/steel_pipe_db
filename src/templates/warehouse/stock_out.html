{% extends "base.html" %}
{% block title %}确认出库 · Ayanami_Rei{% endblock %}

{% block content %}
<header class="page-head">
    <div class="title-row">
        <h1><i class="bi bi-box-arrow-up-right" aria-hidden="true"></i>确认出库</h1>
        <span class="stat-inline">此操作将永久从库存移除并写入审计链</span>
    </div>
</header>

<div class="narrow">
    <div class="panel">
        <div class="panel-body">
            <div class="subject is-warn">
                <i class="bi bi-box-seam subject-icon" aria-hidden="true"></i>
                <span class="subject-label">管子编号</span>
                <span class="subject-id">{{ pipe_id }}</span>
            </div>

            <p class="mb-1">确认要将此管子从库存中移除吗？此操作将：</p>
            <ul class="impact">
                <li>将管子状态改为 <span class="badge is-none"><i class="bi bi-box-arrow-up-right" aria-hidden="true"></i>已出库</span></li>
                <li>记录出库时间和操作人</li>
                <li>减少对应库位的可用计数 <code>used_count</code></li>
                <li>写入审计日志（哈希链防篡改）</li>
            </ul>

            <form method="POST" action="/tubes/stock-out">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <input type="hidden" name="pipe_id" value="{{ pipe_id }}">
                <div class="form-actions">
                    <button type="submit" class="btn btn-danger-solid">
                        <i class="bi bi-check-lg" aria-hidden="true"></i> 确认出库
                    </button>
                    <a href="/tubes" class="btn btn-ghost">取消</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
