{% extends "base.html" %}
{% block title %}确认出库 · Ayanami_Rei{% endblock %}

{% block styles %}
<style>
    .confirm-shell {
        max-width: 560px;
        margin: 24px auto 0;
    }
    .page-head h1 { margin: 0 0 4px; font-size: 22px; font-weight: 600; letter-spacing: -0.02em; color: var(--text-strong); }
    .page-head .sub { color: var(--text-faint); font-size: 13px; }
    .pipe-hero {
        background: var(--warning-soft);
        border: 1px solid rgba(251, 191, 36, 0.35);
        border-radius: 12px;
        padding: 16px 20px;
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 20px;
    }
    .pipe-hero .icon {
        width: 36px; height: 36px;
        border-radius: 8px;
        background: rgba(251, 191, 36, 0.15);
        color: #fcd34d;
        display: flex; align-items: center; justify-content: center;
        font-size: 18px;
    }
    .pipe-hero .meta { color: #fcd34d; }
    .pipe-hero .meta strong { font-weight: 600; }
    .pipe-hero code {
        color: #fcd34d;
        background: rgba(251, 191, 36, 0.12);
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 13px;
    }
    .impact-list {
        margin: 14px 0 24px;
        padding-left: 20px;
        color: var(--text-muted);
        font-size: 13.5px;
        line-height: 1.85;
    }
    .impact-list li::marker { color: var(--text-faint); }
</style>
{% endblock %}

{% block content %}
<div class="confirm-shell">
    <div class="page-head">
        <h1><i class="bi bi-box-arrow-up-right" style="color:#fcd34d;margin-right:8px"></i>确认出库</h1>
        <div class="sub">此操作将永久从库存移除并写入审计链</div>
    </div>

    <div class="surface">
        <div class="surface-body">
            <div class="pipe-hero">
                <div class="icon"><i class="bi bi-box-seam"></i></div>
                <div class="meta">
                    <strong>管子编号:</strong> <code>{{ pipe_id }}</code>
                </div>
            </div>

            <p>确认要将此管子从库存中移除吗？此操作将：</p>
            <ul class="impact-list">
                <li>将管子状态改为 <span class="badge bg-secondary">已出库</span></li>
                <li>记录出库时间和操作人</li>
                <li>减少对应库位的可用计数 <code>used_count</code></li>
                <li>写入审计日志（哈希链防篡改）</li>
            </ul>

            <form method="POST" action="/tubes/stock-out">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <input type="hidden" name="pipe_id" value="{{ pipe_id }}">
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-danger-subtle">
                        <i class="bi bi-check-lg"></i> 确认出库
                    </button>
                    <a href="/tubes" class="btn btn-ghost">取消</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
